# Producción de pruebas en Contabo. Caddy (de /opt/fijazo/deploy) hace de proxy HTTPS por la red deploy_fijazo.
services:
  web:
    build: { context: ., args: { APP_VERSION: "${APP_VERSION:-dev}" } }
    container_name: imagroup-web
    restart: unless-stopped
    environment: { PUBLIC_URL: "https://imagroup.raser.pe" }
    volumes: [ "/opt/imagroup/data:/data" ]
    networks: [ proxy ]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
networks:
  proxy: { external: true, name: deploy_fijazo }
